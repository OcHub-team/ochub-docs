<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OcHub · GPUI documentation renderer</title>
    <script>
      // GPUI already converts CSS pixels to backing pixels with devicePixelRatio.
      // Chromium automation can expose a device-pixel content box at 2x while
      // reporting devicePixelRatio=1, which makes GPUI lay out the scene at half
      // size. The contentRect path is standards-based and remains correct on
      // real Retina displays, so make GPUI use that path consistently.
      const resizeEntryPrototype = globalThis.ResizeObserverEntry?.prototype;
      const devicePixelDescriptor = resizeEntryPrototype &&
        Object.getOwnPropertyDescriptor(resizeEntryPrototype, "devicePixelContentBoxSize");
      if (devicePixelDescriptor?.configurable) {
        delete resizeEntryPrototype.devicePixelContentBoxSize;
      }
    </script>
    <link
      data-trunk
      rel="rust"
      data-bin="ochub-docs-renderer"
      data-bindgen-target="web"
      data-wasm-opt="0"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #151613; }
      body { color: #f1f0e8; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #151613;
        transition: opacity 180ms cubic-bezier(.25, 1, .5, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-copy { display: grid; gap: 12px; justify-items: center; max-width: 36rem; padding: 2rem; text-align: center; }
      .mark { width: 34px; height: 34px; border: 1px solid #6e6f64; border-radius: 9px; display: grid; place-items: center; }
      .mark::before { content: ""; width: 12px; height: 12px; border: 2px solid #75a7ff; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
      strong { font-weight: 650; }
      p { margin: 0; color: #96958d; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark::before { animation-duration: 1.8s; } #boot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-copy">
        <div class="mark" aria-hidden="true"></div>
        <strong>Starting ochub-ui on GPUI Web</strong>
        <p id="boot-detail">Initializing WebGPU and the Rust/WASM runtime…</p>
      </div>
    </div>
    <script>
      const boot = document.querySelector("#boot");
      const detail = document.querySelector("#boot-detail");
      if (!("gpu" in navigator)) {
        detail.textContent = "This browser does not expose WebGPU. The static component reference remains available in the documentation.";
        document.querySelector(".mark").hidden = true;
      } else {
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            boot.classList.add("done");
            window.setTimeout(() => boot.remove(), 220);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true });
      }
    </script>
  </body>
</html>
