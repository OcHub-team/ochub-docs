[workspace]

[package]
name = "ochub-docs-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ochub-docs-renderer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
js-sys = "0.3"
ochub-ui = { version = "0.3.3", git = "https://github.com/OcHub-team/ochub-ui.git", tag = "v0.3.3" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
